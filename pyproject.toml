[project]
name = "aipdm"
version = "0.1.0"
description = "Busca offline em fotos e documentos por pessoa, data, objeto e texto."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "pywebview[gtk]>=6.2.1",
    "rapidocr>=3.9.2",
    "tokenizers>=0.23.2",
    "uvicorn>=0.54.0",
    "xxhash>=4.0.1",
]

[project.scripts]
aipdm = "aipdm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aipdm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/aipdm/core"]

[[tool.mypy.overrides]]
module = "aipdm.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: usa a pasta real em AIPDM_TEST_DIR (somente leitura)"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "onnx>=1.23.0",
    "open-clip-torch>=3.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.17.0",
]

[tool.uv]
# rapidocr requires the GUI build of OpenCV (bundles Qt); the headless build provides the same cv2.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
